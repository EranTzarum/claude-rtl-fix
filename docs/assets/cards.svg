<svg xmlns="http://www.w3.org/2000/svg" width="940" height="180" viewBox="0 0 940 180" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Right direction: Every line with Hebrew reads right to left, even when it opens with an English word.. English in order: Commands, names and numbers inside a Hebrew line keep their left-to-right order.. Clean prompts: The prompt box shows Hebrew in the right order, and the model gets it without marks.">
  <g transform="translate(0 0)">
    <rect width="296" height="180" rx="14" fill="#0d1117" stroke="#0F766E" stroke-opacity=".55"/>
    <rect width="296" height="6" rx="3" fill="#0F766E"/>
    <circle cx="44" cy="52" r="24" fill="#0F766E"/><g transform="translate(44 52)"><path d="M-11 0l7 8l15 -16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="80" y="60" font-size="22" font-weight="700" fill="#fff">Right direction</text>
    <text x="24" y="104" font-size="16" fill="#c9d1d9">Every line with Hebrew reads</text>
    <text x="24" y="128" font-size="16" fill="#c9d1d9">right to left, even when it</text>
    <text x="24" y="152" font-size="16" fill="#c9d1d9">opens with an English word.</text>
  </g>
  <g transform="translate(322 0)">
    <rect width="296" height="180" rx="14" fill="#0d1117" stroke="#2563EB" stroke-opacity=".55"/>
    <rect width="296" height="6" rx="3" fill="#2563EB"/>
    <circle cx="44" cy="52" r="24" fill="#2563EB"/><g transform="translate(44 52)"><path d="M3 -13l-11 15h8l-3 12l11-16h-8z" fill="#fff"/></g>
    <text x="80" y="60" font-size="22" font-weight="700" fill="#fff">English in order</text>
    <text x="24" y="104" font-size="16" fill="#c9d1d9">Commands, names and numbers</text>
    <text x="24" y="128" font-size="16" fill="#c9d1d9">inside a Hebrew line keep</text>
    <text x="24" y="152" font-size="16" fill="#c9d1d9">their left-to-right order.</text>
  </g>
  <g transform="translate(644 0)">
    <rect width="296" height="180" rx="14" fill="#0d1117" stroke="#B45309" stroke-opacity=".55"/>
    <rect width="296" height="6" rx="3" fill="#B45309"/>
    <circle cx="44" cy="52" r="24" fill="#B45309"/><g transform="translate(44 52)"><path d="M0 -12l11 4v8c0 7-5 11-11 14c-6-3-11-7-11-14v-8z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M-5 1l4 4l7-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="80" y="60" font-size="22" font-weight="700" fill="#fff">Clean prompts</text>
    <text x="24" y="104" font-size="16" fill="#c9d1d9">The prompt box shows Hebrew</text>
    <text x="24" y="128" font-size="16" fill="#c9d1d9">in the right order, and the</text>
    <text x="24" y="152" font-size="16" fill="#c9d1d9">model gets it without marks.</text>
  </g>
</svg>
